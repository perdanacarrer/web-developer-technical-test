services:
  app:
    build: .
    container_name: movie-app
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
    volumes:
      # Keeps the SQLite favorites database on the host so it survives
      # `docker compose down`. Comment this whole block out for a fully
      # ephemeral container.
      - db-data:/var/www/html/database

volumes:
  db-data:
